<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NIRMAAN — Turn waste observations into verified community action. A civic-tech platform connecting citizens, volunteers, and organizations." />
    <meta name="theme-color" content="#3F6F5B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>NIRMAAN — Verified Community Action</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('nirmaan-ui-theme') || 'light';
          var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = theme === 'system' ? (isSystemDark ? 'dark' : 'light') : theme;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
